[project]
name = "career-compass-ai-backend"
version = "0.1.0"
description = "Career Compass AI backend — modular monolith (Phase 0 foundation)"
requires-python = ">=3.12,<3.13"
readme = "README.md"

dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "email-validator>=2.1,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.13,<2.0",
    "psycopg[binary,pool]>=3.1,<4.0",
    "redis>=5.0,<6.0",
    "passlib[argon2]>=1.7,<2.0",
    "pyjwt>=2.8,<3.0",
    "python-multipart>=0.0.9",
    "structlog>=24.1,<25.0",
    "boto3>=1.34,<2.0",
    "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2,<9.0",
    "pytest-asyncio>=0.23,<1.0",
    "pytest-cov>=5.0,<6.0",
    "ruff>=0.5,<1.0",
    "mypy>=1.10,<2.0",
    "pip-audit>=2.7,<3.0",
]

[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Alembic migrations mix autogenerated DDL (long constraint/FK lines that
# Alembic itself regenerates in this shape) with inline RLS policy SQL
# strings — reformatting either by hand fights the tooling rather than
# helping readability. Line length is enforced everywhere else.
"alembic/versions/*.py" = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection pattern is `param: T = Depends(...)` —
# calling a function in an argument default is exactly how FastAPI is
# meant to be used, not the mutable-default-argument bug B008 normally
# guards against. require_permission() is our own dependency-factory
# following the same pattern (it returns a Depends-compatible callable).
extend-immutable-calls = ["fastapi.Depends", "app.api.dependencies.require_permission"]

[tool.mypy]
python_version = "3.12"
strict = true
disallow_untyped_defs = true
ignore_missing_imports = true

# Hybrid strictness (per architecture decision): strict mode is the
# project-wide default and applies in full to domain/, application/,
# api/, ai_platform/, and core/. The single, narrowly-scoped exception
# below covers app.adapters.db, where SQLAlchemy's declarative/ORM layer
# (relationship() typing, hybrid properties, session-bound query results)
# makes full strict-mode compliance impractical without heavy annotation
# overhead that doesn't correspond to real type safety gains. No other
# package is exempted — adapters.identity_providers, adapters.ai_providers,
# and every other adapter still run under full strict mode, since those
# don't have SQLAlchemy's dynamic-typing constraints.
[[tool.mypy.overrides]]
module = "app.adapters.db.*"
disallow_untyped_defs = false
disallow_any_generics = false
warn_return_any = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
    "unit: fast, no infrastructure required",
    "integration: requires the local Postgres test database (career_compass_test)",
    "e2e: full-stack, reserved for when the frontend exists",
]
filterwarnings = [
    # passlib's utils module unconditionally imports the stdlib `crypt`
    # module (deprecated, slated for removal in Python 3.13+) even though
    # we only use its argon2 scheme. Upstream passlib issue, not ours —
    # revisit when passlib fixes it or the project moves to Python 3.13.
    "ignore:'crypt' is deprecated:DeprecationWarning:passlib.utils",
    # Same upstream-passlib category: it accesses argon2-cffi's
    # __version__ attribute in a way argon2-cffi itself now deprecates.
    # No module scope here (unlike the crypt filter above) — the warning
    # is attributed to argon2-cffi's own module at the point it's raised,
    # not to passlib.handlers.argon2 where the call appears in the
    # traceback, so a module-scoped filter silently fails to match.
    "ignore:Accessing argon2.__version__ is deprecated:DeprecationWarning",
]
