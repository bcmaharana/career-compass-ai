services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: compass-postgres
    environment:
      POSTGRES_USER: compass
      POSTGRES_PASSWORD: compass
      POSTGRES_DB: career_compass
    ports:
      - "5432:5432"
    volumes:
      - compass_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U compass -d career_compass"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: compass-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: compass-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: compass
      MINIO_ROOT_PASSWORD: compass_secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - compass_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: compass-backend
    env_file:
      - ../backend/.env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ../backend/app:/app/app
      - ../backend/scripts:/app/scripts

volumes:
  compass_postgres_data:
  compass_minio_data:
