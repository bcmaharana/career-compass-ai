server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # nginx's own default (1m) is well under the backend's real photo
    # limit (MAX_PHOTO_SIZE_BYTES = 5MB, career_profile_service.py) —
    # confirmed live 2026-08-10: a >1MB photo upload got a fast 413
    # straight from nginx before ever reaching the backend. 6m gives the
    # 5MB app-level limit a little headroom for multipart overhead.
    client_max_body_size 6m;

    # /api/* proxies to the backend container by Docker Compose service
    # name — "backend", not localhost (same class of gotcha CLAUDE.md
    # documents for DATABASE_URL/OBJECT_STORAGE_ENDPOINT).
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /storage/* proxies to MinIO by Docker Compose service name, same
    # pattern as /api/ above. MinIO itself has no host port exposure in
    # prod (infra/docker-compose.prod.yml) — this is the only public
    # path to it, and only for the public-read photos bucket (its
    # public-read bucket policy is what actually gates access; nginx
    # itself applies no auth here). The private resumes bucket is never
    # reachable this way — it has no public URL, only presigned URLs /
    # backend-mediated access (see ObjectStorageRepository.upload vs
    # upload_private).
    # `^~` is required, not cosmetic: without it, this plain prefix
    # location loses to the regex static-asset-caching location below
    # for any key ending in .jpg/.png/etc (nginx prefers a matching
    # regex location over a plain-prefix one) — confirmed live
    # 2026-08-10, nginx tried to serve uploaded photos as local static
    # files (404, "No such file or directory") instead of proxying to
    # MinIO. `^~` tells nginx to stop checking regex locations once this
    # prefix matches.
    location ^~ /storage/ {
        proxy_pass http://minio:9000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite hashes JS/CSS filenames, so those are safe to cache long-term
    # — a new deploy gets new filenames, never serving stale content.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html itself must never be cached, or a returning visitor
    # keeps loading an old build that references filenames a new deploy
    # already deleted.
    location / {
        add_header Cache-Control "no-store";
        try_files $uri /index.html;
    }
}
